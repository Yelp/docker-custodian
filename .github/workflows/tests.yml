---
name: Tests

"on":
  push:
    branches:
  pull_request:
    branches: [master]

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.7"
            toxenv: py37
            os: ubuntu-22.04
          - python-version: "3.8"
            toxenv: py38
            os: ubuntu-24.04
          - python-version: "3.9"
            toxenv: py39
            os: ubuntu-24.04
          - python-version: "3.14"
            toxenv: py314
            os: ubuntu-26.04

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install tox
      - name: Run tests
        env:
          TOXENV: ${{ matrix.toxenv }}
        run: |
          tox
